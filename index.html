<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ateeq | The Reality Change</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@300;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #000;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Cairo', sans-serif;
            color: #fff;
        }

        /* خلفية الصورة - تأكد إن اسمها bg.jpg */
        .bg-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('bg.jpg') no-repeat center center;
            background-size: cover;
            filter: brightness(35%); 
            z-index: -1;
        }

        /* حاوية الإيموجيز الدوارة */
        .bg-icons {
            position: absolute;
            width: clamp(300px, 80vw, 600px);
            height: clamp(300px, 80vw, 600px);
            display: flex;
            justify-content: center;
            align-items: center;
            animation: rotateIcons 40s linear infinite;
            opacity: 0.4;
            z-index: 1;
        }

        .icon { 
            position: absolute; 
            font-size: 3rem; 
            cursor: pointer; 
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            user-select: none;
        }

        .icon:active { transform: scale(2) rotate(15deg); opacity: 1; }

        .i1 { top: 0; } .i2 { right: 0; } .i3 { bottom: 0; } .i4 { left: 0; }
        .i5 { top: 15%; right: 15%; } .i6 { bottom: 15%; left: 15%; }

        .container { position: relative; z-index: 10; text-align: center; padding: 20px; pointer-events: none; }
        .main-q, .statement, .countdown, .reward { pointer-events: auto; }

        .main-q { font-family: 'Amiri', serif; font-size: clamp(2.2rem, 8vw, 4.8rem); margin-bottom: 5px; }
        
        .statement { 
            font-size: 1.1rem; 
            color: #c5a059; 
            margin-bottom: 25px; 
            border-left: 2px solid #c5a059; 
            padding-left: 10px; 
            display: inline-block; 
        }

        /* العداد التنازلي */
        .countdown { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; }
        .time-box { background: rgba(0, 0, 0, 0.8); border: 1px solid #c5a059; padding: 10px; min-width: 70px; border-radius: 8px; }
        .time-box span { display: block; font-size: 1.5rem; font-weight: 700; color: #c5a059; }
        .time-box label { font-size: 0.6rem; color: #aaa; }

        /* جملة توقع واكسب */
        .reward {
            font-size: 1.2rem;
            letter-spacing: 4px;
            color: #fff;
            background: rgba(197, 160, 89, 0.2);
            padding: 5px 20px;
            display: inline-block;
            border-radius: 50px;
            animation: pulse 2s infinite;
        }

        @keyframes rotateIcons { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }

    </style>
</head>
<body>

    <div class="bg-overlay"></div>

    <div class="bg-icons">
        <div class="icon i1">👕</div>
        <div class="icon i2">💎</div>
        <div class="icon i3">⌚</div>
        <div class="icon i4">👠</div>
        <div class="icon i5">💍</div>
        <div class="icon i6">👑</div>
    </div>

    <div class="container">
        <h1 class="main-q">توقع إيه البراند؟</h1>
        <p class="statement">إحنا مش مجرد براند زي أي براند.. إحنا جايين نغير الواقع</p>
        
        <div class="countdown" id="timer">
            <div class="time-box"><span id="days">00</span><label>أيام</label></div>
            <div class="time-box"><span id="hours">00</span><label>ساعات</label></div>
            <div class="time-box"><span id="minutes">00</span><label>دقائق</label></div>
            <div class="time-box"><span id="seconds">00</span><label>ثواني</label></div>
        </div>

        <p class="reward">توقع صح.. واكسب</p>
    </div>

    <script>
        const countDownDate = new Date("July 20, 2026 00:00:00").getTime();
        setInterval(function() {
            const now = new Date().getTime();
            const distance = countDownDate - now;
            document.getElementById("days").innerHTML = Math.floor(distance / (1000 * 60 * 60 * 24));
            document.getElementById("hours").innerHTML = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            document.getElementById("minutes").innerHTML = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            document.getElementById("seconds").innerHTML = Math.floor((distance % (1000 * 60)) / 1000);
        }, 1000);
    </script>
</body>
</html>
